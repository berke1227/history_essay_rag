[project]
name = "turk-devletleri-rag"
version = "0.1.0"
description = "Türk devletleri makaleleri üzerinde çalışan, kaynağa sıkı sıkıya bağlı (grounded) RAG soru-cevap sistemi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=5.6.0",
    "ollama>=0.6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0.0", "fpdf2>=2.7.0"]

[project.scripts]
tdrag = "tdrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdrag"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
